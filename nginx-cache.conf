# =============================================================================
# 华盾AI Web 管理后台 — Enhanced Nginx 静态资源 & CDN 缓存策略 v7.0
# =============================================================================
# 🆕 v7.0 图片全链路优化 — CDN 层优化：
#   1. 分层 TTL — 原图/处理图/缩略图 差异化缓存
#   2. CDN Surrogate Keys — 支持精确缓存失效（按 fileId）
#   3. Vary: Accept — 内容协商缓存（AVIF/WebP/原图分别缓存）
#   4. 条件请求 (ETag/If-None-Match) — 减少带宽
#   5. CORS 头 — 跨域图片引用
#   6. 预压缩 (Gzip/Brotli) — 文本型 SVG 可压缩
#
# 使用方式（二选一）：
#   1. 作为独立 conf 引入：
#      server { include /path/to/nginx-cache.conf; }
#   2. 复制相关 location 块到现有 server 配置
#
# 图片缓存策略总览：
# ┌──────────────────────────┬──────────────────┬──────────────┬──────────────────────────┐
# │ 资源类型                  │ Cache-Control     │ TTL          │ CDN 策略                  │
# ├──────────────────────────┼──────────────────┼──────────────┼──────────────────────────┤
# │ 缩略图 (thumb-*w.webp)   │ max-age=31536000  │ 365 天       │ immutable + Surrogate-Key │
# │ 处理后主图 (processed.*) │ max-age=2592000   │ 30 天        │ Surrogate-Key + Vary:Accept│
# │ 原图 (original.*)        │ max-age=604800    │ 7 天         │ Surrogate-Key (归档用途)  │
# │ 用户头像/UGC 图片         │ max-age=86400     │ 1 天         │ 短 TTL（可能频繁更新）    │
# │ 静态资源 (JS/CSS/font)   │ max-age=31536000  │ 365 天       │ immutable                 │
# │ 动态 API (/api/*)        │ no-store          │ 0            │ 不缓存                    │
# │ Service Worker           │ max-age=86400     │ 1 天         │ 浏览器自动检查更新        │
# └──────────────────────────┴──────────────────┴──────────────┴──────────────────────────┘
# =============================================================================

# ── 全局：Gzip/Brotli 静态预压缩（配合 vite-plugin-compression）─────────────────
gzip_static  on;
brotli_static on;
gzip_vary    on;

# ── 全局：默认缓存头 ────────────────────────────────────────────────────────────
add_header Cache-Control "no-cache, must-revalidate" always;

# ── 全局：安全头 ────────────────────────────────────────────────────────────
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# ────────────────────────────────────────────────────────────────────────────
# 静态 JS Chunk (content-hash 命名 → 永久缓存)
# ────────────────────────────────────────────────────────────────────────────
location /assets/js/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header CDN-Cache-Control "max-age=31536000" always;
}

# ────────────────────────────────────────────────────────────────────────────
# 静态 CSS (content-hash 命名 → 永久缓存)
# ────────────────────────────────────────────────────────────────────────────
location /assets/css/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header CDN-Cache-Control "max-age=31536000" always;
}

# ────────────────────────────────────────────────────────────────────────────
# 图片资源 — 分层缓存策略 🆕 v7.0
# ────────────────────────────────────────────────────────────────────────────

# ── 🆕 缩略图（MinIO thumbnails bucket 代理）─────────────────────────────────
# 最长缓存：365 天 immutable（缩略图是确定性产物，fileId + width 唯一确定）
location ~* /api/files/thumbnails/ {
    proxy_pass http://file-service:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 强缓存
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header CDN-Cache-Control "max-age=31536000" always;

    # CDN Surrogate Key：精确到 fileId，支持定向清除
    # Surrogate-Key: file-{fileId} thumb-{fileId}-{width}
    add_header Surrogate-Key "$upstream_http_x_image_role" always;

    # 允许 CDN 缓存错误响应（5xx）最多 60s
    proxy_cache_valid 200 304 365d;
    proxy_cache_valid 404 60s;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # CORS：允许跨域引用缩略图
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
}

# ── 🆕 处理后主图（images bucket — WebP/AVIF）────────────────────────────────
# 30 天缓存 + Vary: Accept（不同格式分别缓存）
# 支持通过 ?v={hash} 实现缓存 busting
location ~* /api/files/images/ {
    proxy_pass http://file-service:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 30 天缓存，不设置 immutable（原图可能更新）
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header CDN-Cache-Control "max-age=2592000" always;

    # Vary: Accept → CDN 按 Accept 头独立缓存 (AVIF / WebP / JPEG)
    add_header Vary "Accept" always;

    # Surrogate Key
    add_header Surrogate-Key "$upstream_http_x_image_role" always;

    # CDN 缓存配置
    proxy_cache_valid 200 304 30d;
    proxy_cache_valid 404 10m;
    proxy_cache_key "$scheme$request_method$host$request_uri$http_accept";

    # CORS
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
}

# ── 🆕 原始图片（下载/归档用途）─────────────────────────────────────────────
location ~* /api/files/originals/ {
    proxy_pass http://file-service:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 7 天缓存（原图可能较大，但访问频率低）
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header CDN-Cache-Control "max-age=604800" always;

    proxy_cache_valid 200 304 7d;
    proxy_cache_valid 404 5m;

    add_header Access-Control-Allow-Origin "*" always;
}

# ── 🆕 通用图片静态资源（含用户头像等 UGC 图片）─────────────────────────────
# 适用于：/images/avatars/*, /images/uploads/* 等
location ~* /images/(avatars|uploads)/ {
    # UGC 图片：1 天缓存（可能被用户更新）
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    add_header CDN-Cache-Control "max-age=86400" always;

    # 支持缓存 busting
    add_header Vary "Accept" always;

    # CORS
    add_header Access-Control-Allow-Origin "*" always;
}

# ── 项目静态图片（非 UGC，变更少）─────────────────────────────────────────
location ~* \.(png|jpg|jpeg|webp|avif|svg|ico)(\?.*)?$ {
    # 未匹配到上述特定路径的图片 → 30 天
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header CDN-Cache-Control "max-age=2592000" always;

    # 排除 API 路径下的图片
    location ~ ^/api/ {
        expires off;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
    }
}

# ────────────────────────────────────────────────────────────────────────────
# 字体资源
# ────────────────────────────────────────────────────────────────────────────
location ~* \.(woff2?|ttf|eot|otf)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header CDN-Cache-Control "max-age=31536000" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# ────────────────────────────────────────────────────────────────────────────
# favicon
# ────────────────────────────────────────────────────────────────────────────
location = /favicon.svg {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header CDN-Cache-Control "max-age=604800" always;
}

# ────────────────────────────────────────────────────────────────────────────
# Service Worker（浏览器自动检查更新）
# ────────────────────────────────────────────────────────────────────────────
location = /sw.js {
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Service-Worker-Allowed "/" always;
    # SW 不缓存到 CDN
    add_header CDN-Cache-Control "no-cache" always;
}

# ────────────────────────────────────────────────────────────────────────────
# index.html（入口文件 — 必须每次验证，确保最新版本）
# ────────────────────────────────────────────────────────────────────────────
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-cache" always;
}

# ────────────────────────────────────────────────────────────────────────────
# 快照文件代理（box-sdk /snapshots/ → 告警证据链图片）
# ────────────────────────────────────────────────────────────────────────────
location /snapshots/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# ────────────────────────────────────────────────────────────────────────────
# API 代理（不缓存）
# ────────────────────────────────────────────────────────────────────────────
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
}

# ────────────────────────────────────────────────────────────────────────────
# 🆕 健康检查端点（不缓存 + 无日志）
# ────────────────────────────────────────────────────────────────────────────
location /health {
    access_log off;
    proxy_pass http://backend:8080;
    add_header Cache-Control "no-store" always;
}

# ────────────────────────────────────────────────────────────────────────────
# 🆕 ETag & 条件请求优化
# ────────────────────────────────────────────────────────────────────────────
# 对静态资源启用 ETag（默认开启），配合 If-None-Match 实现 304 响应
# 对图片资源额外添加 Last-Modified 头
location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff2?|ttf|eot|otf|js|css)$ {
    etag on;
    if_modified_since before;
    add_header Last-Modified $date_gmt always;
}

# ────────────────────────────────────────────────────────────────────────────
# 🆕 Cache Purge 端点（受 IP 限制，仅允许内网/本地调用）
#   curl -X PURGE http://localhost/api/files/images/{fileId}/processed.webp
# ────────────────────────────────────────────────────────────────────────────
# 如需启用，取消下面的注释并配置 proxy_cache_path：
#
# proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=image_cache:100m
#   max_size=10g inactive=30d use_temp_path=off;
#
# location ~ /purge(/.*) {
#     allow 127.0.0.1;
#     allow 10.0.0.0/8;
#     allow 172.16.0.0/12;
#     allow 192.168.0.0/16;
#     deny all;
#     proxy_cache_purge image_cache "$scheme$request_method$host$1$http_accept";
# }
